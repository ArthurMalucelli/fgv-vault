<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz CPA-10 Cap 6 — Renda Variável</title>
<style>
  :root {
    --bg-0: #0a0e1a;
    --bg-1: #11162a;
    --bg-2: #1a2140;
    --accent: #5fffd1;
    --accent-2: #7c5cff;
    --good: #3ddc84;
    --bad: #ff4d6d;
    --text: #e8ecf5;
    --muted: #8892b0;
    --line: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg-0) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-weight: 600; letter-spacing: 0.3px; font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .score-pill {
    background: var(--bg-1);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .score-pill strong { color: var(--text); font-weight: 600; }

  .progress {
    height: 4px; width: 100%;
    background: var(--bg-1);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    width: 0%;
    transition: width 320ms cubic-bezier(.4,0,.2,1);
  }

  .card {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }

  .qmeta {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .qtext {
    font-size: 21px;
    line-height: 1.45;
    font-weight: 500;
    margin-bottom: 24px;
  }

  .options {
    display: flex; flex-direction: column; gap: 10px;
  }
  .opt {
    display: flex; align-items: flex-start; gap: 14px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 160ms ease;
    text-align: left;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    font-family: inherit;
    width: 100%;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .opt:disabled { cursor: default; }
  .opt .letter {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    display: grid; place-items: center;
    font-weight: 600; font-size: 13px;
    color: var(--muted);
  }
  .opt.correct {
    border-color: var(--good);
    background: rgba(61, 220, 132, 0.12);
  }
  .opt.correct .letter { background: var(--good); color: #0a0e1a; }
  .opt.wrong {
    border-color: var(--bad);
    background: rgba(255, 77, 109, 0.12);
  }
  .opt.wrong .letter { background: var(--bad); color: white; }

  .explain {
    margin-top: 22px;
    padding: 16px 18px;
    border-radius: 12px;
    background: rgba(124, 92, 255, 0.08);
    border: 1px solid rgba(124, 92, 255, 0.25);
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
    display: none;
  }
  .explain.show { display: block; }
  .explain b { color: var(--accent); }

  .actions {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 22px;
  }
  button.btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0a0e1a;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.3px;
    transition: transform 120ms ease, opacity 160ms ease;
  }
  button.btn:hover { transform: translateY(-1px); }
  button.btn.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }

  /* Intro */
  .intro {
    text-align: center;
    padding: 60px 28px;
  }
  .intro h1 {
    font-size: 32px;
    margin: 0 0 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .intro p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 460px;
    margin: 0 auto 28px;
  }
  .intro .stats {
    display: flex; gap: 32px; justify-content: center;
    margin: 28px 0;
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .intro .stats strong { display: block; font-size: 28px; color: var(--text); margin-bottom: 4px; font-variant-numeric: tabular-nums;}

  /* Final */
  .final {
    text-align: center;
    padding: 50px 28px;
  }
  .final .ring {
    width: 180px; height: 180px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bg-2) 0);
    display: grid; place-items: center;
    position: relative;
  }
  .final .ring::before {
    content: ""; position: absolute; inset: 12px;
    background: var(--bg-1); border-radius: 50%;
  }
  .final .ring .pct {
    position: relative; font-size: 38px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .final h2 { margin: 0 0 8px; font-size: 26px; }
  .final p.sub { color: var(--muted); margin-bottom: 32px; }
  .review {
    text-align: left;
    margin-top: 32px;
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }
  .review h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  .review-item {
    background: var(--bg-2);
    border-left: 3px solid var(--bad);
    padding: 14px 16px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .review-item .q { font-weight: 600; margin-bottom: 6px; }
  .review-item .a { color: var(--muted); font-size: 13px; }
  .review-item .a b { color: var(--good); }

  @media (max-width: 600px) {
    .qtext { font-size: 18px; }
    .card { padding: 24px 20px; }
  }
</style>
</head>
<body>
<div class="app">

<header>
  <div class="brand"><span class="dot"></span> Quiz · CPA-10 Cap 6 · Renda Variável</div>
  <div class="score-pill" id="scorePill" style="display:none">
    <strong id="scoreNum">0</strong> / <span id="scoreTotal">0</span>
  </div>
</header>

<div class="progress" id="progressWrap" style="display:none">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div id="screen"></div>

</div>

<script>
const QUESTIONS = [
  // CONCEITO BASE
  {
    q: "Qual a principal diferença entre renda fixa e renda variável?",
    opts: [
      "Renda fixa tem prazo definido, renda variável não tem prazo",
      "Renda fixa representa promessa de pagamento (dívida), renda variável dá participação no capital social",
      "Renda fixa é tributada, renda variável é isenta",
      "Renda fixa é negociada em bolsa, renda variável no mercado de balcão"
    ],
    correct: 1,
    why: "Renda fixa = dívida (capital de terceiros). Renda variável = participação no capital próprio da empresa."
  },
  {
    q: "Capital próprio de uma empresa corresponde a:",
    opts: [
      "Dívidas com bancos e debêntures emitidas",
      "Patrimônio líquido (recursos dos sócios + lucros retidos)",
      "Valor de mercado das ações na bolsa",
      "Caixa disponível em conta corrente"
    ],
    correct: 1,
    why: "Capital próprio = PL. Capital de terceiros = dívidas. Distinção central pra entender renda fixa x variável."
  },
  {
    q: "Qual o lote-padrão de negociação de ações no Brasil?",
    opts: ["10 ações", "50 ações", "100 ações", "1.000 ações"],
    correct: 2,
    why: "Lote-padrão = 100 ações. Por isso ações com preço alto têm investimento mínimo elevado e podem demandar split."
  },

  // ON x PN
  {
    q: "Qual tipo de ação confere direito a voto em assembleia geral?",
    opts: [
      "Ação preferencial (PN)",
      "Ação ordinária (ON)",
      "Ambas têm direito a voto",
      "Nenhuma das duas, voto é só do acionista controlador"
    ],
    correct: 1,
    why: "ON dá voto. PN não vota (salvo exceções). Em troca, PN tem prioridade em dividendos e na massa falida."
  },
  {
    q: "Em uma liquidação da empresa, quem recebe primeiro entre acionistas?",
    opts: [
      "Acionistas ordinários, por terem direito a voto",
      "Acionistas preferenciais, depois os ordinários",
      "Ordem é definida pela quantidade de ações",
      "Todos recebem proporcionalmente, sem prioridade"
    ],
    correct: 1,
    why: "Na massa falida, PN tem prioridade sobre ON. Mas ambos só recebem depois dos credores (renda fixa)."
  },
  {
    q: "Identifique a alternativa correta sobre identificação de ações na B3:",
    opts: [
      "Dígito 3 = preferencial, dígito 4 = ordinária",
      "Dígito 3 = ordinária (ex: PETR3), dígito 4 = preferencial (ex: PETR4)",
      "Dígito 5 = ordinária, dígito 6 = preferencial",
      "Dígito final indica setor da empresa"
    ],
    correct: 1,
    why: "Final 3 = ON, final 4 = PN. PETR3 é ordinária, PETR4 é preferencial."
  },
  {
    q: "O segmento Novo Mercado da B3 admite:",
    opts: [
      "Apenas ações preferenciais",
      "Ações ordinárias e preferenciais em qualquer proporção",
      "Apenas ações ordinárias no capital social",
      "Apenas units (combinação de ON e PN)"
    ],
    correct: 2,
    why: "Novo Mercado é o segmento de governança superior da B3 desde 2000. Só admite ON, alinhado a padrão internacional."
  },

  // CANAIS
  {
    q: "Sobre CTVM e DTVM, é correto afirmar:",
    opts: [
      "Apenas CTVM pode operar diretamente em bolsa, DTVM precisa intermediar via corretora",
      "Desde 2009, CTVM e DTVM foram equiparadas e ambas operam diretamente em bolsa",
      "DTVM só pode distribuir títulos públicos, não ações",
      "São o mesmo tipo de instituição com nomes diferentes desde sempre"
    ],
    correct: 1,
    why: "Decisão Bacen + CVM em 2009 equiparou as duas. Hoje não há diferença prática de acesso à bolsa."
  },
  {
    q: "O home broker é:",
    opts: [
      "Um tipo de corretora que opera apenas online",
      "Plataforma eletrônica do investidor que envia ordens à corretora, e dela à bolsa, em milissegundos",
      "Sistema de negociação direta investidor-bolsa, sem corretora",
      "Aplicativo do banco pra acompanhar ações, sem permissão de operar"
    ],
    correct: 1,
    why: "Home broker é a interface do investidor, vinculada a uma corretora. As ordens passam pela corretora antes de irem pra bolsa."
  },

  // IPO
  {
    q: "Em uma oferta pública SECUNDÁRIA de ações:",
    opts: [
      "São emitidas ações novas, e os recursos vão pra empresa",
      "São vendidas ações já existentes por acionistas atuais, e os recursos vão pra eles",
      "É a segunda emissão de ações da empresa após o IPO",
      "Apenas grandes investidores podem participar"
    ],
    correct: 1,
    why: "Oferta secundária = ações já existentes. Recursos vão pros acionistas vendedores, NÃO pra empresa. Primária é o oposto."
  },
  {
    q: "Qual o objetivo do período de reserva em um IPO?",
    opts: [
      "Reservar ações pra investidores institucionais antes do varejo",
      "Tempo em que potenciais compradores manifestam interesse à corretora pelas ações",
      "Período de carência antes do investidor poder vender as ações compradas",
      "Prazo pra empresa decidir se vai ou não realizar o IPO"
    ],
    correct: 1,
    why: "Período de reserva é a janela em que o investidor diz à corretora quanto quer comprar (em ações ou em R$)."
  },
  {
    q: "Quando ocorre sobredemanda em um IPO:",
    opts: [
      "O IPO é cancelado e remarcado",
      "O preço da ação é aumentado pra reduzir a demanda",
      "Ocorre rateio: cada investidor recebe parcela proporcional ao seu pedido",
      "Apenas os primeiros a pedir recebem ações"
    ],
    correct: 2,
    why: "Sobredemanda (demanda > oferta) gera rateio proporcional. Investidor recebe menos do que pediu, na mesma proporção dos demais."
  },
  {
    q: "Em uma ordem LIMITADA num IPO, o investidor:",
    opts: [
      "Aceita comprar a qualquer preço final do lançamento",
      "Define o preço máximo que aceita pagar; só compra se preço final for igual ou inferior",
      "Define quantidade fixa de ações a comprar, com preço variável",
      "Compra apenas se houver rateio"
    ],
    correct: 1,
    why: "Ordem limitada protege contra preço alto, mas pode não ser executada. Ordem a mercado garante execução, sem proteção."
  },

  // PROVENTOS
  {
    q: "Sobre tributação de DIVIDENDOS pra pessoa física no Brasil:",
    opts: [
      "Tributados a 15% retidos na fonte",
      "Tributados a 20% via DARF",
      "Isentos de imposto de renda",
      "Tributados conforme tabela progressiva do IR"
    ],
    correct: 2,
    why: "Dividendos são isentos pra PF. Razão: o lucro já foi tributado na empresa via IRPJ/CSLL. JCP, ao contrário, é tributado a 15% na fonte."
  },
  {
    q: "Por que existe o JCP (Juros sobre Capital Próprio)?",
    opts: [
      "É forma obrigatória de remuneração mínima ao acionista",
      "Substitui dividendos quando a empresa tem prejuízo",
      "É dedutível do IRPJ/CSLL pra empresa, gerando vantagem fiscal",
      "É pago apenas pra acionistas preferenciais"
    ],
    correct: 2,
    why: "JCP é dedutível da base de IRPJ e CSLL no lucro real. Empresa paga menos imposto distribuindo JCP. Limite: TJLP sobre o PL."
  },
  {
    q: "Qual a alíquota de IR sobre JCP pra pessoa física?",
    opts: ["Isento", "15% retido na fonte", "20% via DARF", "22,5% conforme tabela regressiva"],
    correct: 1,
    why: "JCP é tributado a 15% na fonte. Como a empresa deduziu o valor do imposto dela, a Receita cobra na ponta do acionista."
  },
  {
    q: "Em uma BONIFICAÇÃO em ações:",
    opts: [
      "Entra dinheiro novo na empresa, capital social aumenta",
      "Não há entrada de recursos novos; reservas de lucro são reclassificadas como capital social",
      "Acionista vende ações de volta pra empresa",
      "Empresa compra ações no mercado pra distribuir aos sócios"
    ],
    correct: 1,
    why: "Bonificação NÃO traz dinheiro novo. Só reclassifica PL. Acionista fica com mais ações, cada uma a preço menor. Patrimônio total não muda."
  },
  {
    q: "Qual a principal diferença entre BONIFICAÇÃO e SUBSCRIÇÃO?",
    opts: [
      "Bonificação é em dinheiro, subscrição em ações",
      "Bonificação não traz recursos novos pra empresa, subscrição traz (aumento de capital efetivo)",
      "Subscrição só ocorre em IPO, bonificação em qualquer momento",
      "Bonificação tem custo pro acionista, subscrição não"
    ],
    correct: 1,
    why: "Bonificação = transferência interna de PL (sem caixa novo). Subscrição = aumento de capital com entrada de dinheiro."
  },

  // EVENTOS
  {
    q: "Após um DESDOBRAMENTO (split) de 1:5, o que acontece com o patrimônio do acionista?",
    opts: [
      "Aumenta 5 vezes",
      "Cai 5 vezes",
      "Não se altera; só muda a quantidade de ações e o preço unitário",
      "Aumenta apenas se a empresa pagar dividendo simultâneo"
    ],
    correct: 2,
    why: "Split não muda valor patrimonial nem participação %. Apenas muda a quantidade (sobe) e o preço unitário (cai), proporcionalmente."
  },
  {
    q: "Qual a principal motivação pra uma empresa fazer GRUPAMENTO de ações?",
    opts: [
      "Aumentar o capital social",
      "Sair da faixa de penny stock e reduzir volatilidade do preço",
      "Reduzir o número de acionistas",
      "Pagar dividendos extraordinários"
    ],
    correct: 1,
    why: "Grupamento (inplit) é o inverso do split. Tira a ação de penny stock (< R$ 1) e reduz volatilidade. Penny stock é excluído do Ibovespa."
  },
  {
    q: "Ações negociadas abaixo de R$ 1,00 (penny stocks):",
    opts: [
      "Têm tributação reduzida em ganho de capital",
      "Não podem fazer parte do Índice Bovespa",
      "São proibidas de serem negociadas em bolsa",
      "Recebem dividendos em dobro como compensação"
    ],
    correct: 1,
    why: "Penny stocks são excluídas do Ibovespa pela própria regra da bolsa. Por isso empresas fazem grupamento pra escapar dessa faixa."
  },

  // RISCOS
  {
    q: "O risco SISTEMÁTICO (risco de mercado):",
    opts: [
      "Pode ser totalmente eliminado por diversificação",
      "Não pode ser eliminado por diversificação; afeta todos os ativos",
      "Só afeta ações de empresas pequenas",
      "É o risco específico de cada empresa"
    ],
    correct: 1,
    why: "Sistemático = de mercado, não diversificável. Causado por crises, juros, política. Todos os investidores em ações estão expostos."
  },
  {
    q: "O risco específico de uma empresa também é chamado de:",
    opts: [
      "Risco de mercado",
      "Risco sistemático",
      "Risco não sistemático ou idiossincrático",
      "Risco de liquidez"
    ],
    correct: 2,
    why: "Risco específico = risco não sistemático = risco idiossincrático. Eliminável por diversificação."
  },
  {
    q: "No mercado de ações, o RISCO DE LIQUIDEZ pode ser observado por:",
    opts: [
      "Volatilidade histórica do preço",
      "Volume diário negociado e spread bid-ask (diferença entre melhor preço de compra e venda)",
      "Política de dividendos da empresa",
      "Setor econômico em que a empresa atua"
    ],
    correct: 1,
    why: "Liquidez se mede por volume negociado e spread no book. Spread alto = liquidez baixa = risco de vender abaixo do preço justo."
  },
  {
    q: "Diversificar a carteira de ações reduz qual tipo de risco?",
    opts: [
      "Apenas o risco sistemático",
      "Apenas o risco específico (não sistemático)",
      "Reduz ambos igualmente",
      "Não reduz nenhum risco, só aumenta retorno esperado"
    ],
    correct: 1,
    why: "Diversificação elimina risco específico. O sistemático (de mercado) sobra, independente de quantas ações você tenha."
  },

  // DESPESAS
  {
    q: "Os EMOLUMENTOS na negociação de ações são cobrados por:",
    opts: [
      "Pela corretora (CTVM)",
      "Pela CVM como taxa de fiscalização",
      "Pela própria B3, pra cobrir o serviço de registro da operação",
      "Pelo Banco Central"
    ],
    correct: 2,
    why: "Emolumentos = receita da B3, por operação realizada na bolsa. Corretagem é da corretora. Custódia é da corretora/banco."
  },
  {
    q: "A taxa de CUSTÓDIA remunera:",
    opts: [
      "A intermediação da ordem entre investidor e bolsa",
      "O serviço de registro da operação na B3",
      "A manutenção da posição em conta junto à Clearing da B3",
      "A análise de relatórios fornecida pela corretora"
    ],
    correct: 2,
    why: "Custódia = manter o ativo na conta. Cobrada por corretora ou banco como repasse do custo da Clearing. Muitas corretoras hoje zeram."
  },

  // TRIBUTAÇÃO
  {
    q: "Qual a alíquota de IR sobre ganho de capital em ações no MERCADO À VISTA?",
    opts: ["10%", "15%", "20%", "22,5%"],
    correct: 1,
    why: "À vista = 15%. Day trade = 20%. Decorar essa diferença é prova certa."
  },
  {
    q: "Em DAY TRADE, qual a alíquota de IR sobre o lucro?",
    opts: ["15%", "17,5%", "20%", "22,5%"],
    correct: 2,
    why: "Day trade = 20% sobre o lucro. Compra e venda no mesmo dia. Sem isenção dos R$ 20.000."
  },
  {
    q: "Sobre a isenção de R$ 20.000 mensais em ações:",
    opts: [
      "Vale pro lucro: ganhos até R$ 20.000/mês são isentos",
      "Vale pras vendas totais: se o investidor vendeu até R$ 20.000 no mês, o ganho é isento",
      "Vale tanto pra mercado à vista quanto pra day trade",
      "É aplicada automaticamente pela corretora, sem necessidade de cálculo"
    ],
    correct: 1,
    why: "É VENDAS, não lucro. Se vender R$ 21.000 e lucrar R$ 100, paga 15% sobre os R$ 100. Isenção não vale pra day trade."
  },
  {
    q: "Sobre a compensação de prejuízos em operações com ações:",
    opts: [
      "Prejuízo de day trade compensa ganho de mercado à vista, e vice-versa",
      "Prejuízos só podem ser compensados no mesmo mês de apuração",
      "Prejuízo de day trade só compensa ganho de day trade; à vista só compensa à vista",
      "Não é permitida nenhuma compensação de prejuízo"
    ],
    correct: 2,
    why: "Não mistura. Day trade só compensa day trade. À vista só compensa à vista. Pode ser no mesmo mês ou meses subsequentes."
  },
  {
    q: "Qual o prazo pra recolhimento do IR sobre ganho em ações via DARF?",
    opts: [
      "Até o dia 30 do mesmo mês de apuração",
      "Até o último dia útil do mês subsequente ao mês de apuração",
      "Anualmente, na declaração de IR",
      "Até 90 dias após a operação"
    ],
    correct: 1,
    why: "DARF até o último dia útil do mês seguinte ao mês de apuração. Investidor calcula sozinho. IR retido na fonte é deduzido."
  },
  {
    q: "Qual a alíquota do IR retido na fonte (dedo-duro) no mercado à vista de ações?",
    opts: [
      "0,005% sobre o volume vendido, se vendas no mês > R$ 20.000",
      "0,5% sobre o volume vendido em qualquer operação",
      "1% sobre o resultado positivo apurado",
      "Não há retenção na fonte no mercado à vista"
    ],
    correct: 0,
    why: "À vista: 0,005% sobre o volume vendido se vendas > R$ 20k/mês. Day trade: 1% sobre o resultado positivo. O retido é deduzido do devido."
  },

  // CLUBE DE INVESTIMENTO
  {
    q: "Qual o número mínimo e máximo de cotistas em um Clube de Investimento?",
    opts: [
      "Mínimo 5, máximo 100",
      "Mínimo 3, máximo 50",
      "Mínimo 10, máximo 30",
      "Mínimo 2, máximo 150"
    ],
    correct: 1,
    why: "Clube de investimento: mínimo 3, máximo 50 cotistas. Decorar."
  },
  {
    q: "Em um Clube de Investimento, qual a concentração máxima de cotas por cotista?",
    opts: ["20%", "30%", "40%", "50%"],
    correct: 2,
    why: "Máximo 40% das cotas pra um único cotista. Evita que vire veículo de 1 pessoa só."
  },
  {
    q: "Qual o percentual mínimo do patrimônio de um Clube de Investimento que deve estar em renda variável?",
    opts: ["51%", "60%", "67%", "75%"],
    correct: 2,
    why: "Mínimo 67% em renda variável (ações, bônus de subscrição, debêntures conversíveis, ETFs etc.). O resto (até 33%) pode ir pra renda fixa."
  },
  {
    q: "Sobre a gestão de um Clube de Investimento por um cotista:",
    opts: [
      "É proibido cotista ser gestor; só profissional autorizado pela CVM pode gerir",
      "Cotista pode ser gestor (eleito em assembleia), mas não pode gerir mais de um clube nem receber remuneração",
      "Cotista gestor pode receber remuneração desde que aprovada em assembleia",
      "Cotista gestor pode gerir até 5 clubes simultaneamente"
    ],
    correct: 1,
    why: "Cotista pode gerir (sem autorização CVM), mas: 1 clube só, sem remuneração direta ou indireta. Outra opção é administrador autorizado pela CVM."

];

// ---- App state ----
let order = [];
let current = 0;
let score = 0;
let wrong = []; // {qIdx, picked}

const screen = document.getElementById('screen');
const scorePill = document.getElementById('scorePill');
const scoreNum = document.getElementById('scoreNum');
const scoreTotal = document.getElementById('scoreTotal');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderIntro() {
  scorePill.style.display = 'none';
  progressWrap.style.display = 'none';
  screen.innerHTML = `
    <div class="card intro">
      <h1>Treino CPA-10 · Renda Variável</h1>
      <p>Quiz de revisão sobre o capítulo 6.1 (Ações) do material ANBIMA. Questões e alternativas embaralhadas a cada rodada. Feedback e explicação na hora.</p>
      <div class="stats">
        <div><strong>${QUESTIONS.length}</strong> questões</div>
        <div><strong>4</strong> opções cada</div>
        <div><strong>~10</strong> min</div>
      </div>
      <button class="btn" onclick="startQuiz()">Começar</button>
    </div>
  `;
}

function startQuiz() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  current = 0;
  score = 0;
  wrong = [];
  scorePill.style.display = 'block';
  progressWrap.style.display = 'block';
  scoreTotal.textContent = order.length;
  renderQuestion();
}

function renderQuestion() {
  const qIdx = order[current];
  const q = QUESTIONS[qIdx];
  // Embaralhar opções
  const optMap = q.opts.map((text, idx) => ({ text, isCorrect: idx === q.correct }));
  const shuffledOpts = shuffle(optMap);
  const correctAfterShuffle = shuffledOpts.findIndex(o => o.isCorrect);

  scoreNum.textContent = score;
  progressFill.style.width = `${(current / order.length) * 100}%`;

  const letters = ['A', 'B', 'C', 'D'];
  screen.innerHTML = `
    <div class="card">
      <div class="qmeta">Questão ${current + 1} de ${order.length}</div>
      <div class="qtext">${q.q}</div>
      <div class="options" id="opts">
        ${shuffledOpts.map((o, i) => `
          <button class="opt" data-i="${i}">
            <span class="letter">${letters[i]}</span>
            <span>${o.text}</span>
          </button>
        `).join('')}
      </div>
      <div class="explain" id="explain"></div>
      <div class="actions" id="actions"></div>
    </div>
  `;

  const optBtns = document.querySelectorAll('.opt');
  optBtns.forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.i), correctAfterShuffle, shuffledOpts, qIdx));
  });
}

function handleAnswer(picked, correctIdx, shuffledOpts, qIdx) {
  const optBtns = document.querySelectorAll('.opt');
  optBtns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correctIdx) btn.classList.add('correct');
    if (i === picked && picked !== correctIdx) btn.classList.add('wrong');
  });

  const isRight = picked === correctIdx;
  if (isRight) score++;
  else wrong.push({ qIdx, pickedText: shuffledOpts[picked].text });

  scoreNum.textContent = score;

  const explain = document.getElementById('explain');
  explain.innerHTML = `<b>${isRight ? 'Certo.' : 'Errado.'}</b> ${QUESTIONS[qIdx].why}`;
  explain.classList.add('show');

  const actions = document.getElementById('actions');
  const isLast = current === order.length - 1;
  actions.innerHTML = `<button class="btn" onclick="nextQuestion()">${isLast ? 'Ver resultado' : 'Próxima'}</button>`;
}

function nextQuestion() {
  current++;
  if (current >= order.length) {
    renderFinal();
  } else {
    renderQuestion();
  }
}

function renderFinal() {
  progressFill.style.width = '100%';
  const pct = Math.round((score / order.length) * 100);
  let comment = '';
  if (pct === 100) comment = 'Perfeito. Vai dominar o gameshow.';
  else if (pct >= 85) comment = 'Forte. Revisa só os pontos específicos.';
  else if (pct >= 70) comment = 'OK, mas tem espaço pra melhorar antes do quiz.';
  else if (pct >= 50) comment = 'Precisa revisar o resumo de novo antes da próxima.';
  else comment = 'Volta pro resumo. Sério.';

  const reviewHtml = wrong.length > 0 ? `
    <div class="review">
      <h3>Revisar erros (${wrong.length})</h3>
      ${wrong.map(w => {
        const q = QUESTIONS[w.qIdx];
        return `
          <div class="review-item">
            <div class="q">${q.q}</div>
            <div class="a">Você: "${w.pickedText}"</div>
            <div class="a"><b>Correto:</b> "${q.opts[q.correct]}"</div>
            <div class="a" style="margin-top:6px">${q.why}</div>
          </div>
        `;
      }).join('')}
    </div>
  ` : `<div class="review"><h3>Sem erros pra revisar.</h3></div>`;

  screen.innerHTML = `
    <div class="card final">
      <div class="ring" style="--p:${pct}"><div class="pct">${pct}%</div></div>
      <h2>${score} de ${order.length} acertos</h2>
      <p class="sub">${comment}</p>
      <div class="actions" style="justify-content:center">
        <button class="btn" onclick="startQuiz()">Refazer</button>
        <button class="btn ghost" onclick="renderIntro()">Tela inicial</button>
      </div>
      ${reviewHtml}
    </div>
  `;
}

renderIntro();
</script>
