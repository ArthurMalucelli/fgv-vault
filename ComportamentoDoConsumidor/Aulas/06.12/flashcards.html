<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards · CDC Prova Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d10;
    --card: #15171c;
    --card-back: #191b14;
    --line: #262931;
    --txt: #e9e6df;
    --dim: #8b8e96;
    --amber: #e3a13c;
    --red: #c96a5e;
    --green: #7fa86c;
    --serif: "Fraunces", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #14161c 0%, var(--bg) 60%);
    color: var(--txt);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--amber); width: 0%; transition: width .3s ease; z-index: 5; }
  header {
    width: 100%; max-width: 760px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 20px 0;
    font-size: 12px; color: var(--dim); letter-spacing: .04em;
  }
  header b { color: var(--amber); font-weight: 500; }
  select {
    background: var(--card); color: var(--txt); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 12px; padding: 7px 10px; border-radius: 7px; cursor: pointer;
  }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  main { width: 100%; max-width: 760px; padding: 26px 20px 120px; flex: 1; }

  #stage { perspective: 1400px; cursor: pointer; }
  #inner {
    display: grid; transition: transform .55s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d;
    min-height: 360px;
  }
  #stage.flipped #inner { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 1px solid var(--line); border-radius: 16px;
    padding: 46px 40px 56px; display: flex; flex-direction: column; gap: 22px;
    box-shadow: 0 24px 60px -28px rgba(0,0,0,.85);
  }
  .face.front { background: linear-gradient(160deg, #181a20 0%, var(--card) 70%); }
  .face.back  { background: linear-gradient(160deg, #1c1e16 0%, var(--card-back) 70%); transform: rotateY(180deg); }
  .tag {
    align-self: flex-start; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
    padding: 4px 10px; border-radius: 99px;
  }
  .face.back .tag { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); }
  .q { font-family: var(--serif); font-weight: 650; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.3; }
  .a { font-family: var(--serif); font-weight: 500; font-size: clamp(19px, 2.8vw, 25px); line-height: 1.45; color: #f0eee6; }
  .hint { margin-top: auto; font-size: 11px; color: var(--dim); letter-spacing: .05em; }
  .num {
    position: absolute; right: 26px; bottom: 14px; font-family: var(--serif);
    font-size: 84px; font-weight: 650; color: rgba(233,230,223,.045); user-select: none;
  }
  .face { position: relative; overflow: hidden; }

  #controls { display: flex; gap: 12px; justify-content: center; margin-top: 26px; height: 52px; }
  #controls button {
    font-family: var(--mono); font-size: 14px; letter-spacing: .03em;
    padding: 14px 28px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--txt); cursor: pointer;
    opacity: 0; pointer-events: none; transform: translateY(6px);
    transition: opacity .25s ease .15s, transform .25s ease .15s, border-color .15s;
  }
  #stage.flipped ~ #controls button { opacity: 1; pointer-events: auto; transform: none; }
  #btn-wrong:hover { border-color: var(--red); color: var(--red); }
  #btn-right:hover { border-color: var(--green); color: var(--green); }
  kbd {
    font-size: 10px; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; color: var(--dim); margin-left: 8px;
  }

  #done { display: none; text-align: center; padding-top: 30px; }
  #done h2 { font-family: var(--serif); font-weight: 650; font-size: 44px; margin-bottom: 8px; }
  #done .sub { color: var(--dim); font-size: 13px; margin-bottom: 30px; }
  #done .score { color: var(--amber); }
  #wrong-list {
    text-align: left; max-width: 560px; margin: 0 auto 30px; font-size: 13px;
    color: var(--dim); line-height: 1.5;
  }
  #wrong-list li { margin-bottom: 8px; list-style: none; padding-left: 18px; position: relative; }
  #wrong-list li::before { content: "✗"; color: var(--red); position: absolute; left: 0; }
  #done button {
    font-family: var(--mono); font-size: 14px; padding: 14px 26px; margin: 0 6px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--txt); cursor: pointer;
  }
  #btn-review { border-color: color-mix(in srgb, var(--amber) 55%, transparent); color: var(--amber); }
  #done button:hover { border-color: var(--amber); }

  footer {
    position: fixed; bottom: 0; width: 100%; text-align: center; padding: 14px;
    font-size: 11px; color: var(--dim); background: linear-gradient(transparent, var(--bg) 45%);
    letter-spacing: .04em;
  }
  @media (max-width: 540px) {
    .face { padding: 30px 24px 44px; }
    #inner { min-height: 420px; }
  }
</style>
</head>
<body>
<div id="bar"></div>
<header>
  <div>CDC · prova 13h · <b id="count">0/0</b> · <span id="missed">0 erradas</span></div>
  <select id="deck-filter" aria-label="Filtrar grupo"></select>
</header>

<main>
  <div id="stage" aria-live="polite">
    <div id="inner">
      <div class="face front">
        <span class="tag" id="f-tag"></span>
        <div class="q" id="f-text"></div>
        <div class="hint">clique ou espaço pra virar</div>
        <div class="num" id="f-num"></div>
      </div>
      <div class="face back">
        <span class="tag">resposta</span>
        <div class="a" id="b-text"></div>
        <div class="num" id="b-num"></div>
      </div>
    </div>
  </div>
  <div id="controls">
    <button id="btn-wrong">errei <kbd>1</kbd></button>
    <button id="btn-right">acertei <kbd>2</kbd></button>
  </div>

  <div id="done">
    <h2><span class="score" id="score"></span></h2>
    <div class="sub" id="done-sub"></div>
    <ul id="wrong-list"></ul>
    <button id="btn-review">revisar erradas</button>
    <button id="btn-restart">recomeçar</button>
  </div>
</main>

<footer>espaço vira · 1 errei · 2 acertei</footer>

<script>
const CARDS = [
  // Regras de decisão
  {g:"Regras de decisão", f:"O que é a regra conjuntiva?", v:"Corte mínimo em TODOS os critérios, de uma vez, sem ordem. Falhou em um, eliminado. Lógica AND."},
  {g:"Regras de decisão", f:"O que é a regra disjuntiva?", v:"Passa quem tem nota máxima em pelo menos UM critério-chave. Lógica OR."},
  {g:"Regras de decisão", f:"O que é a regra lexicográfica?", v:"Vence o melhor no critério MAIS IMPORTANTE. Empatou: decide o segundo critério."},
  {g:"Regras de decisão", f:"O que é a eliminação por aspectos (EBA)?", v:"Cortes aplicados UM critério por vez, na ordem de importância, eliminando a cada rodada (“dos que sobraram…”)."},
  {g:"Regras de decisão", f:"O que é a regra compensatória? Fórmula?", v:"A = Σ (peso × nota). Maior soma vence; nota baixa compensada por alta. A única com conta (Fishbein)."},
  {g:"Regras de decisão", f:"Conjuntiva vs EBA?", v:"Conjuntiva: todos os cortes de uma vez, sem ordem (FOTO). EBA: um corte por rodada, na ordem de importância (FILME)."},
  {g:"Regras de decisão", f:"Lexicográfica vs EBA?", v:"Lexicográfica ESCOLHE o melhor no critério. EBA ELIMINA por corte mínimo."},

  // Hierarquias CAB
  {g:"Hierarquias CAB", f:"Hierarquia padrão (alto envolvimento): ordem?", v:"C → A → B. Pensa, sente, faz. Caso: pesquisou bastante, formou opinião, comprou."},
  {g:"Hierarquias CAB", f:"Hierarquia dissonância-atribuição: ordem?", v:"B → A → C. Impulso → gosta DEPOIS → racionaliza e recomenda."},
  {g:"Hierarquias CAB", f:"Hierarquia de baixo envolvimento: o que define?", v:"Compra ANTES de ter atitude consistente. Preferência fraca só após o uso. Rotina, conveniência."},
  {g:"Hierarquias CAB", f:"Hierarquia experiencial: ordem?", v:"A → B → C. Emoção ANTES da compra. Show, perfume, consumo hedônico."},
  {g:"Hierarquias CAB", f:"Experiencial vs dissonância-atribuição?", v:"Posição do afeto: ANTES da compra = experiencial. DEPOIS (“descobriu que gosta”) = dissonância-atribuição."},

  // Esquemas de reforço
  {g:"Esquemas de reforço", f:"Esquema de intervalo fixo: o que é? Exemplo?", v:"Prêmio em tempo previsível. Liquidação de janeiro, happy hour."},
  {g:"Esquemas de reforço", f:"Esquema de intervalo variável: o que é? Exemplo?", v:"Prêmio em tempo imprevisível; mantém comportamento constante. Cliente oculto."},
  {g:"Esquemas de reforço", f:"Esquema de razão fixa: o que é? Exemplo?", v:"Prêmio após N ações conhecidas. Cartão fidelidade 10 cafés, milhagem."},
  {g:"Esquemas de reforço", f:"Esquema de razão variável: o que é? Exemplo?", v:"Prêmio após número IMPREVISÍVEL de ações. Caça-níquel, loot box."},
  {g:"Esquemas de reforço", f:"Qual esquema é o MAIS resistente à extinção?", v:"Razão variável. Maior taxa de resposta também (efeito jogo)."},
  {g:"Esquemas de reforço", f:"Intervalo vs razão?", v:"O que destrava o prêmio: TEMPO (intervalo) vs NÚMERO DE AÇÕES (razão)."},

  // Conflitos motivacionais
  {g:"Conflitos motivacionais", f:"Conflito aproximação-evitação: o que é? Exemplo?", v:"O MESMO objeto atrai e repele. Carro de luxo: estima (nível 4) vs segurança financeira (nível 2)."},
  {g:"Conflitos motivacionais", f:"Conflito aproximação-aproximação: o que é? O que gera?", v:"Duas opções desejáveis, só cabe uma. Pós-escolha: dissonância cognitiva."},
  {g:"Conflitos motivacionais", f:"Conflito evitação-evitação: o que é? Exemplo?", v:"Duas opções ruins, obrigado a uma. Conserto caro vs 60 prestações."},
  {g:"Conflitos motivacionais", f:"Como classificar qualquer conflito rápido?", v:"Conta objetos e sinais: 2 bons = A-A · 1 objeto com 2 sinais = A-E · 2 ruins = E-E."},

  // Percepção
  {g:"Percepção", f:"O que é vigilância perceptiva?", v:"Notar mais o que é relevante pra necessidade ativa. Vai trocar de celular → vê anúncio em todo lugar."},
  {g:"Percepção", f:"O que é defesa perceptiva?", v:"Bloquear o estímulo ameaçador. Fumante não registra o aviso do maço."},
  {g:"Percepção", f:"O que é adaptação?", v:"Parar de notar o estímulo repetido. Antídoto: contraste (tamanho, cor, posição, novidade)."},
  {g:"Percepção", f:"Vigilância e defesa vs adaptação?", v:"Vigilância/defesa: MOTIVACIONAIS (quero/temo). Adaptação: MECÂNICA (repetição)."},
  {g:"Percepção", f:"Lei de Weber: fórmula? Pegadinha?", v:"ΔI / I = k. O j.n.d. é PROPORCIONAL ao estímulo original. “Constante absoluta” = errado."},
  {g:"Percepção", f:"Subliminar: existe? Funciona?", v:"Existe (abaixo do limiar absoluto). Eficácia comercial NÃO comprovada."},
  {g:"Percepção", f:"Os 3 princípios da Gestalt?", v:"Complementação · figura-fundo (flecha da FedEx) · similaridade. Todo ≠ soma das partes."},
  {g:"Percepção", f:"Limiar absoluto vs diferencial?", v:"Absoluto: mínimo detectável. Diferencial (j.n.d.): menor DIFERENÇA entre dois estímulos."},

  // Atitudes
  {g:"Atitudes", f:"Função utilitária da atitude?", v:"Recompensa e punição concretas. Pasta anticárie pra evitar dentista."},
  {g:"Atitudes", f:"Função expressiva de valor?", v:"Comunicar quem eu sou (AIO: atividades, interesses, opiniões). Camiseta de ONG."},
  {g:"Atitudes", f:"Função ego-defensiva?", v:"Proteger o ego de ameaça ou insegurança interna. Relógio caro contra síndrome do impostor."},
  {g:"Atitudes", f:"Função de conhecimento?", v:"Dar ordem e estrutura, simplificar decisões. “Japonês é confiável.”"},
  {g:"Atitudes", f:"Expressiva de valor vs ego-defensiva?", v:"MOSTRAR o que eu sou vs COMPENSAR o que temo ser."},
  {g:"Atitudes", f:"Os 3 níveis de comprometimento com a atitude?", v:"Condescendência (incentivo externo) → identificação (grupo) → internalização (valor próprio)."},
  {g:"Atitudes", f:"O que é o modelo CAB?", v:"Atitude = Cognição (crenças) + Afeto (sentimentos) + Behavior (intenção de agir). A ORDEM define a hierarquia."},
  {g:"Atitudes", f:"Fishbein: de onde vêm notas e pesos?", v:"De PESQUISA com consumidores reais da categoria. Nunca da diretoria. Atributo tem que ser específico (“qualidade” não vale)."},

  // Riscos percebidos
  {g:"Riscos percebidos", f:"Risco social vs psicológico?", v:"Social: o que VÃO pensar de mim (externo, bens visíveis). Psicológico: culpa interna (luxos pessoais)."},
  {g:"Riscos percebidos", f:"Risco funcional: o que é? Como reduzir?", v:"Produto não cumprir a função. Demo, reviews, teste de 30 dias."},
  {g:"Riscos percebidos", f:"Os 5 riscos percebidos?", v:"Monetário · funcional · físico · social · psicológico."},
  {g:"Riscos percebidos", f:"Risco percebido e envolvimento: qual a relação?", v:"Mais risco percebido → mais envolvimento na decisão."},

  // Aprendizagem & memória
  {g:"Aprendizagem & memória", f:"Condicionamento clássico vs operante?", v:"Involuntário, associação de estímulos, Pavlov (marca = EC) vs voluntário, consequências, Skinner."},
  {g:"Aprendizagem & memória", f:"Reforço negativo vs punição?", v:"Reforço negativo FORTALECE (evita algo ruim: seguro, desodorante). Punição ENFRAQUECE."},
  {g:"Aprendizagem & memória", f:"O que é o efeito halo?", v:"Generalização de estímulo: o parecido com o EC evoca a mesma resposta. Base de extensão de marca, licenciamento, embalagem semelhante."},
  {g:"Aprendizagem & memória", f:"Conjunto evocado vs de consideração?", v:"Evocado: marcas que LEMBRA. Consideração: subconjunto que CONSIDERARIA COMPRAR."},
  {g:"Aprendizagem & memória", f:"O que é o efeito Von Restorff?", v:"O estímulo destoante é mais lembrado. (E familiaridade extrema REDUZ recall.)"},

  // Decisão & papéis
  {g:"Decisão & papéis", f:"Reconhecimento de necessidade vs oportunidade?", v:"Necessidade: estado REAL piorou. Oportunidade: estado IDEAL subiu (propaganda eleva o ideal)."},
  {g:"Decisão & papéis", f:"As 5 etapas do processo de decisão?", v:"Reconhecimento → busca de informações → avaliação de alternativas → compra → pós-compra."},
  {g:"Decisão & papéis", f:"Os 5 papéis de compra?", v:"Iniciador · guardião (filtra informação) · influenciador · comprador · usuário. Podem ser pessoas diferentes."},
  {g:"Decisão & papéis", f:"Lealdade vs inércia?", v:"Lealdade: recompra + atitude FORTE (recusa promoção). Inércia: recompra por preguiça (qualquer cupom rouba)."},
  {g:"Decisão & papéis", f:"Redução de risco age em qual etapa?", v:"AVALIAÇÃO DE ALTERNATIVAS. Opera nos critérios e pesos que o consumidor já aplica."},

  // Fundamentos
  {g:"Fundamentos", f:"As 5 orientações da gestão de marketing?", v:"Produção → produto → vendas → marketing (parte da necessidade) → societal."},
  {g:"Fundamentos", f:"Orientação de vendas vs de marketing?", v:"Vendas: EMPURRAR o que já produz. Marketing: PRODUZIR o que o mercado precisa."},
  {g:"Fundamentos", f:"O que é miopia em marketing?", v:"Definir o negócio pelo PRODUTO e não pela NECESSIDADE. Ferrovias = transporte; Hollywood = entretenimento."},
  {g:"Fundamentos", f:"Sheth: qual a virada na definição de marketing?", v:"Da TROCA pra CRIAÇÃO DE VALOR. Papéis usuário/pagador/comprador, valor em uso, co-criação."},

  // Persuasão
  {g:"Persuasão", f:"Princípio da reciprocidade? Gatilho?", v:"Recebemos, retribuímos. Amostra grátis, brinde."},
  {g:"Persuasão", f:"Princípio da escassez? Gatilho?", v:"O raro vale mais. “Últimas unidades”, contador regressivo."},
  {g:"Persuasão", f:"Autoridade vs consenso vs afeição?", v:"Quem SABE (dentista) vs a MANADA (“mais vendido”) vs quem a gente GOSTA (influencer)."},
  {g:"Persuasão", f:"Princípio da coerência? Gatilho?", v:"Evitamos nos contradizer. Teste grátis que vira assinatura."},

  // Motivação
  {g:"Motivação", f:"Os 5 níveis de Maslow, em ordem?", v:"Fisiológicas → segurança → sociais → estima → autorrealização."},
  {g:"Motivação", f:"As 3 críticas a Maslow?", v:"Um produto satisfaz VÁRIAS necessidades ao mesmo tempo · a ordem é culturalmente limitada · falta validação empírica."},
  {g:"Motivação", f:"Teoria do impulso vs teoria da expectativa?", v:"Impulso: biológica, reduzir tensão (homeostase). Expectativa: cognitiva, puxada por expectativa de resultado desejável."},
  {g:"Motivação", f:"Os 3 fatores que determinam o envolvimento numa decisão?", v:"Pessoais (renda, uso) · situacionais (recorrência, ticket) · do objeto (diferenciação real entre alternativas)."},

  // Complementos de percepção/aprendizagem
  {g:"Percepção", f:"O que é priming?", v:"Propriedade do estímulo que ACIONA um esquema mental (conjunto de crenças) e guia a interpretação."},
  {g:"Aprendizagem & memória", f:"ENC, EC e RC no condicionamento clássico?", v:"ENC: estímulo não condicionado, resposta inata. EC: o neutro que aprende por pareamento repetido (a MARCA). RC: resposta transferida pro EC."},
  {g:"Aprendizagem & memória", f:"Os 4 estágios de Piaget?", v:"Sensório-motor (0-2) · pré-operacional (2-7) · operatório concreto (7-11) · formal (12+). Base da discussão de propaganda infantil."},
  {g:"Aprendizagem & memória", f:"O que melhora o recall de marca?", v:"Marca pioneira · congruência de humor · Von Restorff (destoante) · nostalgia. Familiaridade extrema PIORA."},

  // Complementos de atitudes
  {g:"Atitudes", f:"O que é dissonância cognitiva?", v:"Desconforto quando atitude e comportamento conflitam; agimos pra resolver (mudar um dos dois, buscar respaldo). Pós-compra: propaganda reassegura."},
  {g:"Atitudes", f:"Teoria do julgamento social?", v:"A atitude inicial é o frame de referência; nova informação cai nas LATITUDES de aceitação ou rejeição."},
  {g:"Atitudes", f:"Teoria do equilíbrio?", v:"Tríade pessoa · objeto de atitude · outra pessoa/objeto; ajustamos percepções pra manter consistência. Base do uso de CELEBRIDADES."},
  {g:"Atitudes", f:"Os 6 tipos de poder social?", v:"Referência · legítimo · informação · expertise · recompensa · coercitivo."},
];

let deck = [], pos = 0, wrong = [], rightCount = 0, reviewing = false;

const $ = id => document.getElementById(id);
const stage = $("stage"), done = $("done");

function groups() { return [...new Set(CARDS.map(c => c.g))]; }

function buildFilter() {
  const sel = $("deck-filter");
  sel.innerHTML = `<option value="*">tudo (${CARDS.length})</option>` +
    groups().map(g => `<option value="${g}">${g.toLowerCase()} (${CARDS.filter(c => c.g === g).length})</option>`).join("");
  sel.onchange = () => start();
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function start(customDeck) {
  const filter = $("deck-filter").value;
  deck = customDeck ? [...customDeck] :
    CARDS.map((c, i) => i).filter(i => filter === "*" || CARDS[i].g === filter);
  shuffle(deck);
  pos = 0; wrong = []; rightCount = 0; reviewing = !!customDeck;
  done.style.display = "none";
  stage.style.display = ""; $("controls").style.display = "";
  render();
}

function render() {
  const c = CARDS[deck[pos]];
  stage.classList.remove("flipped");
  // swap content after the unflip starts so the answer doesn't leak
  setTimeout(() => {
    $("f-tag").textContent = c.g;
    $("f-text").textContent = c.f;
    $("b-text").textContent = c.v;
    $("f-num").textContent = $("b-num").textContent = String(pos + 1).padStart(2, "0");
  }, stage.dataset.virgin ? 150 : 0);
  stage.dataset.virgin = "1";
  $("count").textContent = `${pos + 1}/${deck.length}${reviewing ? " · revisão" : ""}`;
  $("missed").textContent = `${wrong.length} errada${wrong.length === 1 ? "" : "s"}`;
  $("bar").style.width = (pos / deck.length * 100) + "%";
}

function flip() { stage.classList.toggle("flipped"); }

function answer(ok) {
  if (!stage.classList.contains("flipped")) return;
  if (ok) rightCount++; else wrong.push(deck[pos]);
  if (pos + 1 < deck.length) { pos++; render(); }
  else finish();
}

function finish() {
  $("bar").style.width = "100%";
  stage.style.display = "none"; $("controls").style.display = "none";
  done.style.display = "block";
  $("score").textContent = `${rightCount}/${deck.length}`;
  $("done-sub").textContent = wrong.length === 0
    ? "rodada limpa. vai pra prova."
    : `${wrong.length} pra revisar antes das 13h:`;
  $("wrong-list").innerHTML = wrong.map(i => `<li>${CARDS[i].f}</li>`).join("");
  $("btn-review").style.display = wrong.length ? "" : "none";
  $("btn-review").textContent = `revisar erradas (${wrong.length})`;
}

stage.onclick = flip;
$("btn-wrong").onclick = e => { e.stopPropagation(); answer(false); };
$("btn-right").onclick = e => { e.stopPropagation(); answer(true); };
$("btn-review").onclick = () => start(wrong);
$("btn-restart").onclick = () => start();

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); done.style.display === "block" ? null : flip(); }
  if (e.key === "1") answer(false);
  if (e.key === "2") answer(true);
});

buildFilter();
start();
</script>
